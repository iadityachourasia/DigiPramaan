[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
path_separator = os

# sqlalchemy.url is intentionally NOT set here — alembic/env.py reads
# DATABASE_URL from app.core.config.get_settings() instead, so there is one
# source of truth for the connection string, not two that can drift.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
