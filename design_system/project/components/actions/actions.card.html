<!-- @dsCard group="Components" viewport="700x260" name="Actions — Button, Icon Button" subtitle="Four types, four sizes, danger, loading, disabled" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:16px;background:var(--background-neutral-elevated)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Button, IconButton } = window.UX4G;
const App = () => (
  <div>
    <div className="row">
      <Button type="filled">Submit</Button>
      <Button type="outlined">Save draft</Button>
      <Button type="tonal">Preview</Button>
      <Button type="text">Cancel</Button>
      <Button type="filled" danger iconLeading="delete">Withdraw</Button>
      <Button type="filled" loading>Submitting</Button>
      <Button type="filled" disabled>Disabled</Button>
    </div>
    <div className="row">
      <Button size="S">Size S</Button>
      <Button size="M">Size M</Button>
      <Button size="L">Size L</Button>
      <Button size="XL">Size XL</Button>
      <Button shape="pill" type="outlined" iconTrailing="arrow_forward">Pill</Button>
    </div>
    <div className="row">
      <IconButton icon="add" ariaLabel="Add" type="filled" />
      <IconButton icon="edit" ariaLabel="Edit" type="outlined" />
      <IconButton icon="more_vert" ariaLabel="More" type="text" />
      <IconButton icon="download" ariaLabel="Download" type="tonal" />
      <IconButton icon="delete" ariaLabel="Delete" type="outlined" danger />
      <IconButton icon="close" ariaLabel="Close" type="text" size="L" />
    </div>
  </div>
);
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
