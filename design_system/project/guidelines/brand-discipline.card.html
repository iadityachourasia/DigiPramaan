<!-- @dsCard group="Brand" viewport="700x200" name="Brand fill discipline" subtitle="Where brand-primary is allowed, and where it is not" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--background-neutral-elevated);font-family:var(--ux4g-font-sans)}
.sw{display:flex;gap:0;border-radius:6px;overflow:hidden}
.sw i{flex:1;height:56px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-size:10px;font-family:var(--ux4g-font-mono)}
.lbl{font-size:11px;color:var(--text-neutral-tertiary);margin:6px 0 2px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tok{font-family:var(--ux4g-font-mono);font-size:10px;color:var(--text-neutral-tertiary)}
</style></head><body>
<div class="row" style="align-items:stretch">
<div style="flex:1;border-radius:8px;overflow:hidden;border:1px solid var(--border-neutral-subtle)">
<div style="background:var(--colors-primary-600);color:#fff;padding:10px 12px;font-weight:600;font-size:13px">Masthead · primary CTA · active state</div>
<div style="padding:12px;background:var(--background-neutral-elevated)"><p class="tok" style="color:var(--text-status-success-default)">Allowed: identity moments and the one primary action.</p></div>
</div>
<div style="flex:1;border-radius:8px;overflow:hidden;border:1px solid var(--border-status-error-strong)">
<div style="background:var(--background-brand-primary-soft);padding:10px 12px;font-size:13px">Cards, charts, KPI washes</div>
<div style="padding:12px;background:var(--background-neutral-elevated)"><p class="tok" style="color:var(--text-status-error-default)">Not allowed: a service that reads as heavily branded reads as marketing.</p></div>
</div>
</div>
</body></html>
