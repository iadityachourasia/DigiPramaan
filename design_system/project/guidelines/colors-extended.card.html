<!-- @dsCard group="Colors" viewport="700x150" name="Extended hues" subtitle="Sky, cyan, lime, gold, pink, purple — data-viz ramps only" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--background-neutral-elevated);font-family:var(--ux4g-font-sans)}
.sw{display:flex;gap:0;border-radius:6px;overflow:hidden}
.sw i{flex:1;height:56px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-size:10px;font-family:var(--ux4g-font-mono)}
.lbl{font-size:11px;color:var(--text-neutral-tertiary);margin:6px 0 2px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tok{font-family:var(--ux4g-font-mono);font-size:10px;color:var(--text-neutral-tertiary)}
</style></head><body>
<div class="sw">
<i style="background:var(--colors-sky-600);color:#fff">sky</i>
<i style="background:var(--colors-cyan-600);color:#fff">cyan</i>
<i style="background:var(--colors-lime-600);color:#171717">lime</i>
<i style="background:var(--colors-gold-600);color:#171717">gold</i>
<i style="background:var(--colors-pink-600);color:#fff">pink</i>
<i style="background:var(--colors-purple-600);color:#fff">purple</i>
<i style="background:var(--colors-yellow-600);color:#171717">yellow</i></div>
<p class="lbl">Each hue carries a 50–900 ramp. Use one hue's ramp for a choropleth; do not mix hues to mean intensity.</p>
</body></html>
