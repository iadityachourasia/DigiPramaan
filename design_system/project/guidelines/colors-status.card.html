<!-- @dsCard group="Colors" viewport="700x210" name="Status colours" subtitle="Success, error, warning, info — semantic use only" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--background-neutral-elevated);font-family:var(--ux4g-font-sans)}
.sw{display:flex;gap:0;border-radius:6px;overflow:hidden}
.sw i{flex:1;height:56px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-size:10px;font-family:var(--ux4g-font-mono)}
.lbl{font-size:11px;color:var(--text-neutral-tertiary);margin:6px 0 2px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tok{font-family:var(--ux4g-font-mono);font-size:10px;color:var(--text-neutral-tertiary)}
</style></head><body>
<p class="lbl">Success · error · warning · info (600 step)</p><div class="sw">
<i style="background:var(--colors-green-600);color:#fff">green 600</i>
<i style="background:var(--colors-red-600);color:#fff">red 600</i>
<i style="background:var(--colors-orange-600);color:#171717">orange 600</i>
<i style="background:var(--colors-blue-600);color:#fff">blue 600</i></div>
<p class="lbl">Soft backgrounds used behind status text</p><div class="sw">
<i style="background:var(--background-status-success-soft)">success soft</i>
<i style="background:var(--background-status-error-soft)">error soft</i>
<i style="background:var(--background-status-warning-soft)">warning soft</i>
<i style="background:var(--background-status-info-soft)">info soft</i></div>
<p class="lbl" style="color:var(--text-status-error-default)">Never decorative. A status token means status — nothing else.</p>
</body></html>
