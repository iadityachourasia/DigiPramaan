<!-- @dsCard group="Spacing" viewport="700x200" name="Elevation" subtitle="Five levels, each a key + ambient shadow pair" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--background-neutral-elevated);font-family:var(--ux4g-font-sans)}
.sw{display:flex;gap:0;border-radius:6px;overflow:hidden}
.sw i{flex:1;height:56px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-size:10px;font-family:var(--ux4g-font-mono)}
.lbl{font-size:11px;color:var(--text-neutral-tertiary);margin:6px 0 2px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tok{font-family:var(--ux4g-font-mono);font-size:10px;color:var(--text-neutral-tertiary)}
</style></head><body>
<div class="row" style="gap:20px;padding:12px 4px">
<div style="text-align:center"><div class="ux4g-elevation-0" style="width:96px;height:64px;background:var(--background-neutral-elevated);border-radius:8px;border:1px solid var(--border-neutral-subtle)"></div><p class="tok">--elevation-0</p></div><div style="text-align:center"><div class="ux4g-elevation-1" style="width:96px;height:64px;background:var(--background-neutral-elevated);border-radius:8px;border:1px solid var(--border-neutral-subtle)"></div><p class="tok">--elevation-1</p></div><div style="text-align:center"><div class="ux4g-elevation-2" style="width:96px;height:64px;background:var(--background-neutral-elevated);border-radius:8px;border:1px solid var(--border-neutral-subtle)"></div><p class="tok">--elevation-2</p></div><div style="text-align:center"><div class="ux4g-elevation-3" style="width:96px;height:64px;background:var(--background-neutral-elevated);border-radius:8px;border:1px solid var(--border-neutral-subtle)"></div><p class="tok">--elevation-3</p></div><div style="text-align:center"><div class="ux4g-elevation-4" style="width:96px;height:64px;background:var(--background-neutral-elevated);border-radius:8px;border:1px solid var(--border-neutral-subtle)"></div><p class="tok">--elevation-4</p></div>
</div>
<p class="lbl">The shadow colour flips from black to white in dark mode. Never write a single hardcoded box-shadow.</p>
</body></html>
