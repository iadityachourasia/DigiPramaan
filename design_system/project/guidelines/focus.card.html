<!-- @dsCard group="Spacing" viewport="700x180" name="Focus & targets" subtitle="2px brand ring at 2px offset · 44px minimum target" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--background-neutral-elevated);font-family:var(--ux4g-font-sans)}
.sw{display:flex;gap:0;border-radius:6px;overflow:hidden}
.sw i{flex:1;height:56px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-size:10px;font-family:var(--ux4g-font-mono)}
.lbl{font-size:11px;color:var(--text-neutral-tertiary);margin:6px 0 2px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tok{font-family:var(--ux4g-font-mono);font-size:10px;color:var(--text-neutral-tertiary)}
</style></head><body>
<div class="row" style="gap:20px">
<span class="ux4g-focusring is-visible"><button class="ux4g-btn ux4g-btn--outlined ux4g-btn--m"><span class="ux4g-btn__label">Focused button</span></button></span>
<span class="ux4g-focusring is-visible ux4g-focusring--circular"><span style="display:inline-flex;width:44px;height:44px;border-radius:50%;background:var(--background-brand-primary-soft)"></span></span>
<span style="display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px dashed var(--border-neutral-strong);border-radius:6px;font-size:10px;color:var(--text-neutral-tertiary)">44×44</span>
</div>
<p class="lbl">Every interactive element shows this ring — table rows, pagination controls, nav items, map regions alike.</p>
</body></html>
