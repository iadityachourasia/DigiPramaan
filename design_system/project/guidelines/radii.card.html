<!-- @dsCard group="Spacing" viewport="700x170" name="Corner radii" subtitle="0 · 2 · 4 · 8 · 12 · 16 · 999 — literal, never rounded to a grid" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--background-neutral-elevated);font-family:var(--ux4g-font-sans)}
.sw{display:flex;gap:0;border-radius:6px;overflow:hidden}
.sw i{flex:1;height:56px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-size:10px;font-family:var(--ux4g-font-mono)}
.lbl{font-size:11px;color:var(--text-neutral-tertiary);margin:6px 0 2px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tok{font-family:var(--ux4g-font-mono);font-size:10px;color:var(--text-neutral-tertiary)}
</style></head><body>
<div class="row">
<div style="text-align:center"><div style="width:72px;height:56px;background:var(--background-brand-primary-soft);border:1px solid var(--border-brand-primary-default);border-radius:0px"></div><p class="tok">radius-none · 0</p></div><div style="text-align:center"><div style="width:72px;height:56px;background:var(--background-brand-primary-soft);border:1px solid var(--border-brand-primary-default);border-radius:2px"></div><p class="tok">radius-xxs · 2</p></div><div style="text-align:center"><div style="width:72px;height:56px;background:var(--background-brand-primary-soft);border:1px solid var(--border-brand-primary-default);border-radius:4px"></div><p class="tok">radius-xs · 4</p></div><div style="text-align:center"><div style="width:72px;height:56px;background:var(--background-brand-primary-soft);border:1px solid var(--border-brand-primary-default);border-radius:8px"></div><p class="tok">radius-sm · 8</p></div><div style="text-align:center"><div style="width:72px;height:56px;background:var(--background-brand-primary-soft);border:1px solid var(--border-brand-primary-default);border-radius:12px"></div><p class="tok">radius-md · 12</p></div><div style="text-align:center"><div style="width:72px;height:56px;background:var(--background-brand-primary-soft);border:1px solid var(--border-brand-primary-default);border-radius:16px"></div><p class="tok">radius-lg · 16</p></div><div style="text-align:center"><div style="width:72px;height:56px;background:var(--background-brand-primary-soft);border:1px solid var(--border-brand-primary-default);border-radius:999px"></div><p class="tok">radius-full · 999</p></div>
</div>
<p class="lbl">8px = buttons, inputs, cards, tables. 4px = tags and small controls. 999 = pills and avatars.</p>
</body></html>
