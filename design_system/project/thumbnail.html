<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px;overflow:hidden}
.tile{display:grid;grid-template-columns:1fr 200px;width:1280px;height:854px}
.main{display:flex;align-items:center;justify-content:center;background:var(--colors-primary-600)}
.mark{font-family:var(--ux4g-font-display);font-weight:700;font-size:190px;line-height:1;letter-spacing:-.02em;color:#fff;white-space:nowrap}
.strip{display:grid;grid-template-rows:repeat(4,1fr);height:854px}
.strip i{display:block}
</style></head><body>
<div class="tile">
  <div class="main"><span class="mark">UX4G</span></div>
  <div class="strip">
    <i style="background:var(--colors-primary-300)"></i>
    <i style="background:var(--colors-green-600)"></i>
    <i style="background:var(--colors-orange-600)"></i>
    <i style="background:var(--colors-red-600)"></i>
  </div>
</div></body></html>
