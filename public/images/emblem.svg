<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none" role="img">
  <!--
    Ashoka Chakra — 24 spokes, drawn to geometry rather than traced.

    NOT the State Emblem of India. That emblem (the Lion Capital of Ashoka) is
    restricted under the State Emblem of India (Prohibition of Improper Use)
    Act, 2005 to specified authorities, so it is not authored here. Before any
    real deployment, DoCA supplies the official emblem asset and this file is
    replaced; the alt text in the message catalogue must be updated to match.

    Strokes use currentColor so the mark inherits the surrounding text colour
    and therefore works in both themes without a second asset.
  -->
  <g stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
    <circle cx="48" cy="48" r="44" stroke-width="3.5"/>
    <circle cx="48" cy="48" r="9.5" stroke-width="2.5"/>
    <circle cx="48" cy="48" r="6.5" fill="currentColor" stroke="none"/>
    <line x1="57.50" y1="48.00" x2="88.50" y2="48.00"/>
    <line x1="57.18" y1="50.46" x2="87.12" y2="58.48"/>
    <line x1="56.23" y1="52.75" x2="83.07" y2="68.25"/>
    <line x1="54.72" y1="54.72" x2="76.64" y2="76.64"/>
    <line x1="52.75" y1="56.23" x2="68.25" y2="83.07"/>
    <line x1="50.46" y1="57.18" x2="58.48" y2="87.12"/>
    <line x1="48.00" y1="57.50" x2="48.00" y2="88.50"/>
    <line x1="45.54" y1="57.18" x2="37.52" y2="87.12"/>
    <line x1="43.25" y1="56.23" x2="27.75" y2="83.07"/>
    <line x1="41.28" y1="54.72" x2="19.36" y2="76.64"/>
    <line x1="39.77" y1="52.75" x2="12.93" y2="68.25"/>
    <line x1="38.82" y1="50.46" x2="8.88" y2="58.48"/>
    <line x1="38.50" y1="48.00" x2="7.50" y2="48.00"/>
    <line x1="38.82" y1="45.54" x2="8.88" y2="37.52"/>
    <line x1="39.77" y1="43.25" x2="12.93" y2="27.75"/>
    <line x1="41.28" y1="41.28" x2="19.36" y2="19.36"/>
    <line x1="43.25" y1="39.77" x2="27.75" y2="12.93"/>
    <line x1="45.54" y1="38.82" x2="37.52" y2="8.88"/>
    <line x1="48.00" y1="38.50" x2="48.00" y2="7.50"/>
    <line x1="50.46" y1="38.82" x2="58.48" y2="8.88"/>
    <line x1="52.75" y1="39.77" x2="68.25" y2="12.93"/>
    <line x1="54.72" y1="41.28" x2="76.64" y2="19.36"/>
    <line x1="56.23" y1="43.25" x2="83.07" y2="27.75"/>
    <line x1="57.18" y1="45.54" x2="87.12" y2="37.52"/>
  </g>
</svg>
